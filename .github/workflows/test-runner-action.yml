name: Test runner-action

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-runner-action.yml'
      - 'runner-action/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This integration test dispatches real workflows to the Azure runner.
  # Configure required reviewers on the production environment before running PR code.
  # Fork PRs cannot access the credentials and must be tested from a trusted branch.
  test-runner-action:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hello world
        uses: ./runner-action
        with:
          github_app_id: ${{ secrets.CDCENT_ACTOR_APP_ID }}
          github_app_pem: ${{ secrets.CDCENT_ACTOR_APP_PEM }}
          wait_for_completion: 'true'
          print_logs: 'true'
          max_retries: '60'
          retry_interval: '10'
          script: |
            echo "Hello, world!"
